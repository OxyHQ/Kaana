# Reconciles the two DNS records required by kaana.ai:
#
# - ACM's validation CNAME is DNS-only so certificate issuance reaches AWS.
# - kaana.ai points at Kaana's dedicated ALB and is proxied so Cloudflare
#   can rate-limit requests before Kaana reads the signed request body.
#
# This lives in the public Kaana repository because GitHub Free does not expose
# organization-level Actions secrets to private repositories. The workflow
# creates missing records only. A conflicting record is reported and left
# untouched; replacing DNS is never an implicit side effect. The sole deletion
# is the legacy api.kaana.ai name, behind an explicit default-off input and only
# after the exact apex ALB record, public Kaana liveness and the old DNS-only
# shared-ALB CNAME are re-verified.
name: Cloudflare DNS

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'check reads only. apply creates missing records.'
        type: choice
        options: [check, apply]
        default: check
        required: true
      validation_name:
        description: 'ACM validation CNAME name from describe-certificate.'
        type: string
        required: false
      validation_value:
        description: 'ACM validation CNAME value.'
        type: string
        required: false
      alb_dns:
        description: 'Kaana ALB DNS name. Empty skips the public record.'
        type: string
        required: false
      retire_legacy_api_dns:
        description: 'With apply, delete the exact reviewed api.kaana.ai CNAME.'
        type: boolean
        default: false
        required: true
      legacy_api_target:
        description: 'Old shared Oxy ALB target. Required byte-exact for retirement.'
        type: string
        required: false

permissions:
  contents: read

jobs:
  dns:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test the reconciler and workflow mutation guard
        run: python3 .github/scripts/cloudflare_dns_test.py

      - name: Reconcile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACTION: ${{ inputs.action }}
          VAL_NAME: ${{ inputs.validation_name }}
          VAL_VALUE: ${{ inputs.validation_value }}
          ALB_DNS: ${{ inputs.alb_dns }}
          RETIRE_LEGACY_API_DNS: ${{ inputs.retire_legacy_api_dns }}
          LEGACY_API_TARGET: ${{ inputs.legacy_api_target }}
        run: |
          python3 .github/scripts/cloudflare_dns.py \
            --action "$ACTION" \
            --validation-name "$VAL_NAME" \
            --validation-value "$VAL_VALUE" \
            --alb-dns "$ALB_DNS" \
            --retire-legacy-api-dns "$RETIRE_LEGACY_API_DNS" \
            --legacy-api-target "$LEGACY_API_TARGET"
