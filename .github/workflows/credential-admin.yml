name: Kaana credential administration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact reviewed one-shot operation
        type: choice
        required: true
        options:
          - list
          - list-deployment-bindings
          - migrate
          - bind-deployment
          - apply-production-deployment-bindings
          - verify-production-deployment-bindings
          - deduplicate-groq
          - deduplicate-openrouter
          - deduplicate-xai
          - rekey-cerebras-primary
          - rekey-groq-primary
          - rekey-openrouter-primary
          - rekey-xai-primary
          - rekey-elevenlabs-primary
          - rekey-groq-secondary-if-different
          - rekey-openrouter-secondary-if-different
          - rekey-xai-secondary-if-different
      binding_operation_id:
        description: Unique kdb_* id (bind-deployment only)
        type: string
        required: false
      deployment_id:
        description: Exact authoritative deployment id (bind-deployment only)
        type: string
        required: false
      provider:
        description: Exact provider slug (bind-deployment only)
        type: string
        required: false
      key_id:
        description: Exact non-secret credential key id (bind-deployment only)
        type: string
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: kaana-credential-administration
  cancel-in-progress: false

env:
  CONFIG_PATH: .github/credential-admin-operations.json
  AWS_REGION: us-west-2

jobs:
  run:
    name: Run reviewed credential operation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Refuse any source except main
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::credential administration may run only from refs/heads/main'
            exit 1
          fi
          if ! jq -e --arg operation "$OPERATION" \
            '. as $config |
             .schemaVersion == 2 and
             (.operations | has($operation)) and
             (.operationTaskProfiles | has($operation)) and
             (.taskProfiles | has($config.operationTaskProfiles[$operation])) and
             ((.operations | keys | sort) == (.operationTaskProfiles | keys | sort))' \
            "$CONFIG_PATH" >/dev/null; then
            echo '::error::the requested operation has no exact reviewed task profile'
            exit 1
          fi

      - name: Configure Kaana-only AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-kaana-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Prove the production inventory is the reviewed binding snapshot
        if: inputs.operation == 'apply-production-deployment-bindings' || inputs.operation == 'verify-production-deployment-bindings'
        run: |
          set -euo pipefail
          manifest=configs/cutovers/production-bindings-snap_dfd6904a99d6313b.json
          bucket=$(jq -r '.inventory.bucket' "$manifest")
          key=$(jq -r '.inventory.key' "$manifest")
          version=$(jq -r '.inventory.s3VersionId' "$manifest")
          expected_sha=$(jq -r '.inventory.contentSha256' "$manifest")
          aws s3api get-object --bucket "$bucket" --key "$key" --version-id "$version" /tmp/reviewed-inventory.json >/dev/null
          actual_sha=$(sha256sum /tmp/reviewed-inventory.json | cut -d' ' -f1)
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo '::error::the immutable inventory object differs from the reviewed content SHA'
            exit 1
          fi
          jq -e --slurpfile inventory /tmp/reviewed-inventory.json '
            .inventory.snapshotId == $inventory[0].snapshotId and
            .inventory.deploymentCount == ($inventory[0].deployments | length) and
            ([.assignments[] | {deploymentId, provider}] | sort_by(.deploymentId)) ==
              ([$inventory[0].deployments[] | {deploymentId, provider}] | sort_by(.deploymentId)) and
            (.assignments | group_by(.provider) | all(map(.keyId) | unique | length == 1))
          ' "$manifest" >/dev/null || {
            echo '::error::binding manifest is not the complete exact reviewed inventory set'; exit 1;
          }

      - name: Promote the pinned image and prove the exact task identity
        id: task
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          family=$(jq -r --arg operation "$OPERATION" \
            '.taskProfiles[.operationTaskProfiles[$operation]].taskDefinitionFamily' \
            "$CONFIG_PATH")
          task_definition=$(aws ecs describe-task-definition \
            --task-definition "$family" --query taskDefinition --output json)
          config=$(jq -c . "$CONFIG_PATH")
          if [[ "$OPERATION" == *production-deployment-bindings ]]; then
            digest=$(aws ecr describe-images --repository-name oxy/kaana \
              --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
            config=$(jq -c --arg image "$(jq -r '.image' "$CONFIG_PATH" | sed 's/@.*//')@$digest" \
              --arg source "$GITHUB_SHA" '.image=$image | .sourceCommit=$source' <<<"$config")
          fi
          CONFIG="$config" \
          TASK_CONFIG=$(jq -c --arg operation "$OPERATION" \
            '.taskProfiles[.operationTaskProfiles[$operation]]' "$CONFIG_PATH") \
          TASK_DEFINITION="$task_definition" python3 - <<'PY'
          import json
          import os
          import re

          config = json.loads(os.environ["CONFIG"])
          task_config = json.loads(os.environ["TASK_CONFIG"])
          task = json.loads(os.environ["TASK_DEFINITION"])
          expected_container = task_config["containerName"]
          containers = [
              item for item in task.get("containerDefinitions", [])
              if item.get("name") == expected_container
          ]
          if len(containers) != 1:
              print("::error::the task definition does not contain exactly one reviewed credential-operation container")
              raise SystemExit(1)
          container = containers[0]
          expected = {
              "family": task_config["taskDefinitionFamily"],
              "status": "ACTIVE",
              "taskRoleArn": task_config["taskRoleArn"],
              "executionRoleArn": task_config["executionRoleArn"],
          }
          for field, value in expected.items():
              if task.get(field) != value:
                  print(f"::error::task definition {field} does not match the reviewed manifest")
                  raise SystemExit(1)
          if task.get("runtimePlatform") != {
              "cpuArchitecture": "ARM64",
              "operatingSystemFamily": "LINUX",
          }:
              print("::error::credential operation is not the reviewed linux/arm64 task")
              raise SystemExit(1)
          image_pattern = re.compile(
              rf"^{config['accountId']}\.dkr\.ecr\.{config['awsRegion']}\.amazonaws\.com/oxy/kaana@sha256:[0-9a-f]{{64}}$"
          )
          if not image_pattern.fullmatch(config["image"]):
              print("::error::the reviewed image is not an exact Kaana ECR digest")
              raise SystemExit(1)
          if not re.fullmatch(r"[0-9a-f]{40}", config["sourceCommit"]):
              print("::error::the reviewed image source is not an exact Git commit")
              raise SystemExit(1)
          if not image_pattern.fullmatch(container.get("image", "")):
              print("::error::the current task does not use an exact Kaana ECR digest")
              raise SystemExit(1)
          if container.get("entryPoint") != ["/usr/local/bin/kaana-credentials"]:
              print("::error::credential operation entry point drifted")
              raise SystemExit(1)
          if container.get("command") != task_config["defaultCommand"]:
              print("::error::credential operation default command drifted")
              raise SystemExit(1)
          if container.get("readonlyRootFilesystem") is not True:
              print("::error::credential operation root filesystem is writable")
              raise SystemExit(1)
          expected_secrets = [{
              "name": "DATABASE_URL",
              "valueFrom": task_config["databaseUrlParameterArn"],
          }]
          if container.get("secrets") != expected_secrets:
              print("::error::credential operation secret binding drifted")
              raise SystemExit(1)
          environment = {
              item.get("name"): item.get("value")
              for item in container.get("environment", [])
          }
          if environment != task_config["environment"]:
              print("::error::credential operation environment drifted")
              raise SystemExit(1)
          log_options = container.get("logConfiguration", {}).get("options", {})
          if log_options.get("awslogs-group") != "/oxy/ecs" or log_options.get("awslogs-stream-prefix") != task_config["logStreamPrefix"]:
              print("::error::credential operation log identity drifted")
              raise SystemExit(1)
          arn = task.get("taskDefinitionArn", "")
          if not arn.startswith(
              f"arn:aws:ecs:{config['awsRegion']}:{config['accountId']}:task-definition/{task_config['taskDefinitionFamily']}:"
          ):
              print("::error::credential operation task ARN is outside the reviewed family")
              raise SystemExit(1)

          for field in (
              "taskDefinitionArn", "revision", "status", "requiresAttributes",
              "compatibilities", "registeredAt", "registeredBy", "deregisteredAt",
          ):
              task.pop(field, None)
          for item in task["containerDefinitions"]:
              if item.get("name") == expected_container:
                  item["image"] = config["image"]
          with open("/tmp/credential-operation-task-definition.json", "w", encoding="utf-8") as output:
              json.dump(task, output, sort_keys=True, separators=(",", ":"))
          PY

          image=$(jq -r '.image' "$CONFIG_PATH")
          source_commit=$(jq -r '.sourceCommit' "$CONFIG_PATH")
          digest="${image##*@}"
          digest_readback=$(aws ecr describe-images \
            --repository-name oxy/kaana \
            --image-ids "imageDigest=$digest" \
            --query 'imageDetails[0].imageDigest' --output text)
          source_readback=$(aws ecr describe-images \
            --repository-name oxy/kaana \
            --image-ids "imageTag=$source_commit" \
            --query 'imageDetails[0].imageDigest' --output text)
          if [ "$digest_readback" != "$digest" ] || [ "$source_readback" != "$digest" ]; then
            echo "::error::the reviewed image digest is not present in Kaana ECR"
            exit 1
          fi

          task_arn=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/credential-operation-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          registered=$(aws ecs describe-task-definition \
            --task-definition "$task_arn" --query taskDefinition --output json)
          config=$(jq -c . "$CONFIG_PATH")
          if [[ "$OPERATION" == *production-deployment-bindings ]]; then
            digest=$(aws ecr describe-images --repository-name oxy/kaana \
              --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
            config=$(jq -c --arg image "$(jq -r '.image' "$CONFIG_PATH" | sed 's/@.*//')@$digest" \
              --arg source "$GITHUB_SHA" '.image=$image | .sourceCommit=$source' <<<"$config")
          fi
          CONFIG="$config" \
          TASK_CONFIG=$(jq -c --arg operation "$OPERATION" \
            '.taskProfiles[.operationTaskProfiles[$operation]]' "$CONFIG_PATH") \
          REGISTERED="$registered" python3 - <<'PY'
          import json
          import os

          config = json.loads(os.environ["CONFIG"])
          task_config = json.loads(os.environ["TASK_CONFIG"])
          task = json.loads(os.environ["REGISTERED"])
          arn = task.get("taskDefinitionArn", "")
          if not arn.startswith(
              f"arn:aws:ecs:{config['awsRegion']}:{config['accountId']}:task-definition/{task_config['taskDefinitionFamily']}:"
          ):
              print("::error::the registered task ARN is outside the reviewed family")
              raise SystemExit(1)
          for field in (
              "taskDefinitionArn", "revision", "status", "requiresAttributes",
              "compatibilities", "registeredAt", "registeredBy", "deregisteredAt",
          ):
              task.pop(field, None)
          with open("/tmp/credential-operation-task-definition.json", encoding="utf-8") as source:
              expected = json.load(source)
          if task != expected:
              print("::error::the registered task definition differs from the derived image-only revision")
              raise SystemExit(1)
          containers = [
              item for item in task.get("containerDefinitions", [])
              if item.get("name") == task_config["containerName"]
          ]
          if len(containers) != 1 or containers[0].get("image") != config["image"]:
              print("::error::credential operation image digest did not survive registration")
              raise SystemExit(1)
          PY
          echo "arn=$task_arn" >> "$GITHUB_OUTPUT"

      - name: Run the one-shot and require a clean exit
        env:
          OPERATION: ${{ inputs.operation }}
          TASK_DEFINITION_ARN: ${{ steps.task.outputs.arn }}
          AUDIT_ACTOR: github-actions:OxyHQ/Kaana:${{ github.run_id }}
          BINDING_OPERATION_ID: ${{ inputs.binding_operation_id }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          PROVIDER: ${{ inputs.provider }}
          KEY_ID: ${{ inputs.key_id }}
        run: |
          set -euo pipefail
          if [[ ! "$AUDIT_ACTOR" =~ ^github-actions:OxyHQ/Kaana:[0-9]+$ ]]; then
            echo '::error::credential audit actor is not the reviewed repository and numeric run id'
            exit 1
          fi
          cluster=$(jq -r '.cluster' "$CONFIG_PATH")
          container=$(jq -r --arg operation "$OPERATION" \
            '.taskProfiles[.operationTaskProfiles[$operation]].containerName' "$CONFIG_PATH")
          security_group=$(jq -r --arg operation "$OPERATION" \
            '.taskProfiles[.operationTaskProfiles[$operation]].securityGroupId' "$CONFIG_PATH")
          log_stream_prefix=$(jq -r --arg operation "$OPERATION" \
            '.taskProfiles[.operationTaskProfiles[$operation]].logStreamPrefix' "$CONFIG_PATH")
          command=$(jq -c --arg operation "$OPERATION" '.operations[$operation]' "$CONFIG_PATH")
          if [ "$OPERATION" = 'bind-deployment' ]; then
            if [[ ! "$BINDING_OPERATION_ID" =~ ^kdb_[0-9a-f]{32}$ ]] ||
               [[ ! "$DEPLOYMENT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]] ||
               [[ ! "$PROVIDER" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] ||
               [[ ! "$KEY_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]; then
              echo '::error::bind-deployment requires exact, well-formed non-secret identities'
              exit 1
            fi
            command=$(jq -cn \
              --arg operation_id "$BINDING_OPERATION_ID" \
              --arg deployment_id "$DEPLOYMENT_ID" \
              --arg provider "$PROVIDER" \
              --arg key_id "$KEY_ID" \
              '["bind-deployment", "--operation-id", $operation_id, "--deployment-id", $deployment_id, "--provider", $provider, "--key-id", $key_id]')
          elif [ -n "$BINDING_OPERATION_ID$DEPLOYMENT_ID$PROVIDER$KEY_ID" ]; then
            echo '::error::binding identity inputs are accepted only by bind-deployment'
            exit 1
          fi
          network=$(jq -c \
            --arg security_group "$security_group" \
            '{awsvpcConfiguration: {subnets: .subnetIds, securityGroups: [$security_group], assignPublicIp: "ENABLED"}}' \
            "$CONFIG_PATH")
          overrides=$(jq -cn \
            --arg container "$container" \
            --argjson command "$command" \
            --arg audit_actor "$AUDIT_ACTOR" \
            '{containerOverrides: [{
              name: $container,
              command: $command,
              environment: [{name: "KAANA_CREDENTIAL_ACTOR", value: $audit_actor}]
            }]}')

          result=$(aws ecs run-task \
            --cluster "$cluster" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --count 1 \
            --launch-type FARGATE \
            --network-configuration "$network" \
            --overrides "$overrides" \
            --output json)
          failures=$(jq '.failures | length' <<<"$result")
          if [ "$failures" != '0' ]; then
            echo '::error::ECS refused the reviewed credential operation'
            jq '.failures' <<<"$result"
            exit 1
          fi
          task_arn=$(jq -r '.tasks[0].taskArn' <<<"$result")
          if [ -z "$task_arn" ] || [ "$task_arn" = 'null' ]; then
            echo '::error::ECS returned no task identity'
            exit 1
          fi
          echo "credential operation task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"

          task=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" \
            --query 'tasks[0]' --output json)
          exit_code=$(jq -r --arg container "$container" \
            '.containers[] | select(.name == $container) | .exitCode // -1' <<<"$task")
          task_id="${task_arn##*/}"
          stream="$log_stream_prefix/$container/$task_id"
          log_read=false
          for _ in $(seq 1 12); do
            if messages=$(aws logs get-log-events \
              --log-group-name /oxy/ecs \
              --log-stream-name "$stream" \
              --limit 200 --start-from-head \
              --query 'events[].message' --output text 2>/dev/null); then
              printf '%s\n' "$messages" | tr '\t' '\n'
              log_read=true
              break
            fi
            sleep 5
          done
          if [ "$log_read" != 'true' ]; then
            echo '::error::the credential operation log stream could not be read'
            exit 1
          fi
          if [ "$exit_code" != '0' ]; then
            reason=$(jq -r '.stoppedReason // "no stopped reason"' <<<"$task")
            echo "::error::credential operation exited $exit_code: $reason"
            exit 1
          fi
          echo "credential operation '$OPERATION' completed successfully"
