name: Kaana credential administration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact reviewed one-shot operation
        type: choice
        required: true
        options:
          - list
          - import-relay-groq
          - import-relay-openrouter
          - import-relay-xai

permissions:
  id-token: write
  contents: read

concurrency:
  group: kaana-credential-administration
  cancel-in-progress: false

env:
  CONFIG_PATH: .github/credential-admin-operations.json
  AWS_REGION: us-west-2

jobs:
  run:
    name: Run reviewed credential operation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Refuse any source except main
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo '::error::credential administration may run only from refs/heads/main'
            exit 1
          fi
          if ! jq -e --arg operation "$OPERATION" \
            '.schemaVersion == 1 and (.operations | has($operation))' \
            "$CONFIG_PATH" >/dev/null; then
            echo '::error::the requested operation is not present in the reviewed manifest'
            exit 1
          fi

      - name: Configure Kaana-only AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-kaana-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Prove the exact task identity
        id: task
        run: |
          set -euo pipefail
          family=$(jq -r '.taskDefinitionFamily' "$CONFIG_PATH")
          task_definition=$(aws ecs describe-task-definition \
            --task-definition "$family" --query taskDefinition --output json)
          CONFIG=$(jq -c . "$CONFIG_PATH") TASK_DEFINITION="$task_definition" python3 - <<'PY'
          import json
          import os

          config = json.loads(os.environ["CONFIG"])
          task = json.loads(os.environ["TASK_DEFINITION"])
          expected_container = config["containerName"]
          containers = [
              item for item in task.get("containerDefinitions", [])
              if item.get("name") == expected_container
          ]
          if len(containers) != 1:
              print("::error::the task definition does not contain exactly one credential-admin container")
              raise SystemExit(1)
          container = containers[0]
          expected = {
              "family": config["taskDefinitionFamily"],
              "status": "ACTIVE",
              "taskRoleArn": config["taskRoleArn"],
              "executionRoleArn": config["executionRoleArn"],
          }
          for field, value in expected.items():
              if task.get(field) != value:
                  print(f"::error::task definition {field} does not match the reviewed manifest")
                  raise SystemExit(1)
          if task.get("runtimePlatform") != {
              "cpuArchitecture": "ARM64",
              "operatingSystemFamily": "LINUX",
          }:
              print("::error::credential-admin is not the reviewed linux/arm64 task")
              raise SystemExit(1)
          if container.get("image") != config["image"]:
              print("::error::credential-admin image digest does not match the reviewed release")
              raise SystemExit(1)
          if container.get("entryPoint") != ["/usr/local/bin/kaana-credentials"]:
              print("::error::credential-admin entry point drifted")
              raise SystemExit(1)
          if container.get("command") != ["list"]:
              print("::error::credential-admin default command is not metadata-only list")
              raise SystemExit(1)
          if container.get("readonlyRootFilesystem") is not True:
              print("::error::credential-admin root filesystem is writable")
              raise SystemExit(1)
          expected_secrets = [{
              "name": "DATABASE_URL",
              "valueFrom": config["databaseUrlParameterArn"],
          }]
          if container.get("secrets") != expected_secrets:
              print("::error::credential-admin secret bindings drifted")
              raise SystemExit(1)
          environment = {
              item.get("name"): item.get("value")
              for item in container.get("environment", [])
          }
          if environment != {
              "AWS_REGION": config["awsRegion"],
              "KAANA_PROVIDER_CREDENTIALS_KMS_KEY_ARN": config["kmsKeyArn"],
          }:
              print("::error::credential-admin environment drifted")
              raise SystemExit(1)
          log_options = container.get("logConfiguration", {}).get("options", {})
          if log_options.get("awslogs-group") != "/oxy/ecs" or log_options.get("awslogs-stream-prefix") != "kaana-credential-admin":
              print("::error::credential-admin log identity drifted")
              raise SystemExit(1)
          arn = task.get("taskDefinitionArn", "")
          if not arn.startswith(
              f"arn:aws:ecs:{config['awsRegion']}:{config['accountId']}:task-definition/{config['taskDefinitionFamily']}:"
          ):
              print("::error::credential-admin task ARN is outside the reviewed family")
              raise SystemExit(1)
          print(arn)
          PY
          task_arn=$(CONFIG=$(jq -c . "$CONFIG_PATH") TASK_DEFINITION="$task_definition" python3 - <<'PY'
          import json
          import os
          print(json.loads(os.environ["TASK_DEFINITION"])["taskDefinitionArn"])
          PY
          )
          echo "arn=$task_arn" >> "$GITHUB_OUTPUT"

      - name: Run the one-shot and require a clean exit
        env:
          OPERATION: ${{ inputs.operation }}
          TASK_DEFINITION_ARN: ${{ steps.task.outputs.arn }}
        run: |
          set -euo pipefail
          cluster=$(jq -r '.cluster' "$CONFIG_PATH")
          container=$(jq -r '.containerName' "$CONFIG_PATH")
          security_group=$(jq -r '.securityGroupId' "$CONFIG_PATH")
          command=$(jq -c --arg operation "$OPERATION" '.operations[$operation]' "$CONFIG_PATH")
          network=$(jq -c \
            --arg security_group "$security_group" \
            '{awsvpcConfiguration: {subnets: .subnetIds, securityGroups: [$security_group], assignPublicIp: "ENABLED"}}' \
            "$CONFIG_PATH")
          overrides=$(jq -cn --arg container "$container" --argjson command "$command" \
            '{containerOverrides: [{name: $container, command: $command}]}')

          result=$(aws ecs run-task \
            --cluster "$cluster" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --count 1 \
            --launch-type FARGATE \
            --network-configuration "$network" \
            --overrides "$overrides" \
            --output json)
          failures=$(jq '.failures | length' <<<"$result")
          if [ "$failures" != '0' ]; then
            echo '::error::ECS refused the reviewed credential operation'
            jq '.failures' <<<"$result"
            exit 1
          fi
          task_arn=$(jq -r '.tasks[0].taskArn' <<<"$result")
          if [ -z "$task_arn" ] || [ "$task_arn" = 'null' ]; then
            echo '::error::ECS returned no task identity'
            exit 1
          fi
          echo "credential operation task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"

          task=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" \
            --query 'tasks[0]' --output json)
          exit_code=$(jq -r --arg container "$container" \
            '.containers[] | select(.name == $container) | .exitCode // -1' <<<"$task")
          task_id="${task_arn##*/}"
          stream="kaana-credential-admin/$container/$task_id"
          log_read=false
          for _ in $(seq 1 12); do
            if messages=$(aws logs get-log-events \
              --log-group-name /oxy/ecs \
              --log-stream-name "$stream" \
              --limit 200 --start-from-head \
              --query 'events[].message' --output text 2>/dev/null); then
              printf '%s\n' "$messages" | tr '\t' '\n'
              log_read=true
              break
            fi
            sleep 5
          done
          if [ "$log_read" != 'true' ]; then
            echo '::error::the credential operation log stream could not be read'
            exit 1
          fi
          if [ "$exit_code" != '0' ]; then
            reason=$(jq -r '.stoppedReason // "no stopped reason"' <<<"$task")
            echo "::error::credential operation exited $exit_code: $reason"
            exit 1
          fi
          echo "credential operation '$OPERATION' completed successfully"
