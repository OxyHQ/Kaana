name: Deploy to AWS

# Kaana's release path: build the arm64 image, push it to ECR, register a task
# definition that names the image by DIGEST, and repoint the services at that
# revision.
#
# SERVICES, plural. One image carries two binaries and there are two services —
# `kaana` serves, `kaana-publisher` writes the inventory the serving tasks read
# — and both are deployed here. Deploying only the first is not a smaller
# release, it is a release the publisher never receives: see the deploy step.
#
# # Why the digest and not a tag
#
# `update-service --force-new-deployment` against a `:latest` tag relaunches
# whatever `:latest` resolves to at that moment, which is not necessarily the
# image this run built — another push, or a retry of an older run, moves the tag
# underneath it. A revision naming `…@sha256:…` is answerable: `what is running`
# is read off the task definition instead of inferred from a mutable tag.
#
# # Who owns what
#
# Terraform owns what a revision CONTAINS — the roles, the log configuration,
# the environment, the `secrets` block, the volume the configuration snapshot is
# mounted from. CI owns which revision RUNS. This job therefore derives its
# revision from the family's current one and replaces exactly one field, the
# image, so a Terraform change to the shape is picked up by the next deploy and
# a deploy never overwrites the shape. The service's `ignore_changes =
# [task_definition]` in oxy-infra is the other half of that bargain.

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-kaana
  # NOT cancel-in-progress. A cancelled run leaves a rollout it started still
  # running, unmonitored: the service goes on replacing tasks, and nobody is
  # left watching for the FAILED that would have failed this job. Two deploys
  # queue instead.
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  # The ECS service, the ECR repository suffix and the container name inside the
  # task definition. All three are `kaana`; the task-definition FAMILY carries
  # the oxy- prefix that oxy-infra's app-service module gives every family.
  APP: kaana
  FAMILY: oxy-kaana
  # The inventory publisher. One image, a different entryPoint and a different
  # task role, so it is a SECOND service and a second family — and it is
  # deployed here for the same reason the serving one is: oxy-infra's
  # `aws_ecs_service.kaana_publisher` carries `ignore_changes = [task_definition]`
  # on the stated bargain that CI owns which revision runs. Nothing was holding
  # up that half, so a Terraform change to the publisher's environment
  # registered a revision the service never adopted, and the running task went
  # on asking the provider set it was created with.
  PUBLISHER_SERVICE: kaana-publisher
  PUBLISHER_FAMILY: oxy-kaana-publisher
  CLUSTER: oxy-cluster

jobs:
  deploy:
    # workflow_dispatch can be run against arbitrary refs; only deploys from the
    # protected main branch may assume the AWS deploy role.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-kaana-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        id: image
        run: |
          set -euo pipefail
          IMG="$ECR_REGISTRY/oxy/$APP"
          # --platform is stated rather than inherited: BuildKit takes the
          # target from the host when none is given, so a runner change would
          # silently ship the wrong architecture.
          docker buildx build \
            --platform linux/arm64 \
            -t "$IMG:${{ github.sha }}" \
            -t "$IMG:latest" \
            --push \
            --metadata-file /tmp/build-metadata.json \
            .
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/build-metadata.json)
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::the build produced no image digest (got '$DIGEST')"; exit 1 ;;
          esac
          echo "image=$IMG@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pushed $IMG@$DIGEST"

      - name: Deploy to ECS (skipped until a service exists)
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail

          # ONE IMAGE, TWO SERVICES, ONE RELEASE.
          #
          # `kaana` serves and `kaana-publisher` writes the inventory the
          # serving tasks read. They are built from one commit into one image
          # on purpose — the Dockerfile says so: a publisher lagging the
          # serving binary produces snapshots against a contract the reader has
          # moved past. Until this step deployed both, that lag was not a risk
          # to be avoided but the steady state, because nothing ever repointed
          # the publisher: oxy-infra cedes `task_definition` to CI with
          # `ignore_changes`, so a Terraform change to the publisher registered
          # a revision the service never adopted and the running task kept the
          # environment it was created with. A provider added to
          # KAANA_PROVIDERS reached the serving task and not the one that
          # discovers models, which is silent — the snapshot simply goes on
          # naming the old provider set.
          #
          # The serving service goes first, which is the order that keeps the
          # common path exactly as it was: if the publisher's rollout fails,
          # this job fails after Kaana is already serving the new image rather
          # than instead of deploying it.
          deploy_one() {
            service="$1"
            family="$2"
            container="$3"

            STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" \
              --query 'services[0].status' --output text 2>/dev/null || echo NONE)
            if [ "$STATUS" != "ACTIVE" ]; then
              echo "::warning::ECS service $service is not ACTIVE (status=$STATUS); the image is in ECR at $IMAGE, nothing to deploy"
              return 0
            fi

            BASE=$(aws ecs describe-task-definition --task-definition "$family" --query 'taskDefinition')

            # Assert the container this job is about to rewrite is actually
            # there. A jq assignment that matches nothing succeeds and returns
            # the document unchanged, so without this the job would register a
            # revision still carrying the OLD image and report a clean deploy.
            # It also holds the two families apart: `oxy-kaana` carries a
            # second container, the inventory-sync sidecar, whose image is
            # public.ecr.aws/aws-cli and is not this build's to move.
            MATCHED=$(printf '%s' "$BASE" | jq --arg c "$container" '[.containerDefinitions[] | select(.name == $c)] | length')
            if [ "$MATCHED" != "1" ]; then
              echo "::error::task definition $family has $MATCHED containers named '$container'; expected exactly 1"
              return 1
            fi

            # Everything except the image comes from the family's current
            # revision — Terraform's shape, carried forward. The dropped keys
            # are the ones describe-task-definition adds and
            # register-task-definition refuses.
            printf '%s' "$BASE" | jq --arg c "$container" --arg img "$IMAGE" '
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
              | .containerDefinitions |= map(if .name == $c then .image = $img else . end)
            ' > "/tmp/task-definition-$service.json"

            ARN=$(aws ecs register-task-definition --cli-input-json "file:///tmp/task-definition-$service.json" \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            echo "registered $ARN"

            # Read the field back. A register that silently kept the old image
            # would otherwise be indistinguishable from a successful one right
            # up until someone asked what version was live.
            REGISTERED=$(aws ecs describe-task-definition --task-definition "$ARN" \
              --query "taskDefinition.containerDefinitions[?name=='$container'].image | [0]" --output text)
            if [ "$REGISTERED" != "$IMAGE" ]; then
              echo "::error::$ARN names image '$REGISTERED', expected '$IMAGE'"
              return 1
            fi

            # register-task-definition does NOT repoint a service. Naming the
            # revision here is what makes this deploy the one being watched
            # below — and for the publisher it is the whole fix: the revision
            # Terraform registered has been sitting unadopted.
            aws ecs update-service --cluster "$CLUSTER" --service "$service" --task-definition "$ARN" >/dev/null
            echo "deploying $ARN; polling rollout state"

            # Poll the PRIMARY deployment to steady state. The AWS
            # services-stable waiter caps at 10 minutes, which is tight while a
            # fresh task pulls the image and warms up against the target group.
            DEADLINE=$(( $(date +%s) + 20 * 60 ))
            while :; do
              if [ "$(date +%s)" -gt "$DEADLINE" ]; then
                echo "::error::$service did not stabilize within 20 minutes"
                aws ecs describe-services --cluster "$CLUSTER" --services "$service" \
                  --query 'services[0].deployments' --output table || true
                return 1
              fi
              PRIMARY=$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" \
                --query 'services[0].deployments[?status==`PRIMARY`] | [0]')
              PRIMARY_TD=$(printf '%s' "$PRIMARY" | jq -r '.taskDefinition // ""')
              ROLLOUT=$(printf '%s' "$PRIMARY" | jq -r '.rolloutState // "IN_PROGRESS"')
              RUNNING=$(printf '%s' "$PRIMARY" | jq -r '.runningCount // 0')
              DESIRED=$(printf '%s' "$PRIMARY" | jq -r '.desiredCount // 0')
              echo "  $service rolloutState=$ROLLOUT  running=$RUNNING/$DESIRED"

              # Identity, not just state. A COMPLETED belonging to somebody
              # else's revision — a concurrent apply, a manual rollback — is not
              # this deploy succeeding, and counting it as one is how a job
              # reports green for a change that never went out.
              if [ "$PRIMARY_TD" != "$ARN" ]; then
                echo "::error::the PRIMARY deployment of $service is $PRIMARY_TD, not the revision this run registered ($ARN)"
                return 1
              fi

              case "$ROLLOUT" in
                COMPLETED)
                  # A service parked at desiredCount=0 reaches COMPLETED with
                  # nothing launched, because there was nothing to launch. That
                  # is a legitimate state — it is how a service is held while a
                  # prerequisite is missing — so it is not a failure. But the
                  # word "deployed" would be a lie about it, and this job is the
                  # last thing anyone reads before believing the change went
                  # out. For the publisher the lie would be larger: parked at
                  # zero it writes no snapshot at all, and every unpinned
                  # reference is refused an hour later.
                  if [ "$DESIRED" = "0" ]; then
                    echo "::warning::$service rollout COMPLETED with desiredCount=0: $ARN is the service's revision, but no task is running it. This run proves the image built and the revision registered, and nothing about whether Kaana serves."
                    return 0
                  fi
                  echo "deployed $service at $IMAGE ($RUNNING/$DESIRED tasks running)"
                  return 0
                  ;;
                FAILED)
                  echo "::error::$service rollout failed"
                  aws ecs describe-services --cluster "$CLUSTER" --services "$service" \
                    --query 'services[0].events[0:10]' --output table || true
                  return 1
                  ;;
              esac
              sleep 15
            done
          }

          deploy_one "$APP" "$FAMILY" "$APP"
          deploy_one "$PUBLISHER_SERVICE" "$PUBLISHER_FAMILY" "$PUBLISHER_SERVICE"
