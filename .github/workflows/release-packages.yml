name: Release packages

# Publishes one package of this repository (`@kaana.ai/contracts` or
# `@kaana.ai/sdk`) to npm through Oxy's shared `npm-release.yml`, with npm
# trusted publishing (OIDC) and provenance; there is no NPM_TOKEN. Each
# package's own pre-flight is its `prepublishOnly`. ADR 0002, decision 11;
# O:docs/engineering/package-rules.md#publishing.
#
# Order: the SDK depends on the exact `@kaana.ai/contracts` version of its
# commit, so that contracts version is published first; the release refuses an
# SDK whose contracts range does not resolve on the registry yet.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name to release, e.g. @kaana.ai/sdk
        required: true
        type: string
      expected_source_sha:
        description: Exact protected main commit to build and publish
        required: true
        type: string
      dry_run:
        description: Build, verify and preflight the registry without publishing
        required: true
        type: boolean
        default: true
      dist_tag:
        description: npm dist-tag (latest only moves forward)
        required: true
        type: string
        default: latest

# The shared workflow's publish job is the only one that keeps id-token.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release:
    uses: OxyHQ/oxy/.github/workflows/npm-release.yml@main
    with:
      package: ${{ inputs.package }}
      expected_source_sha: ${{ inputs.expected_source_sha }}
      dry_run: ${{ inputs.dry_run }}
      dist_tag: ${{ inputs.dist_tag }}
