name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes its previous run. A push to `main`
# never does: each `main` commit gets its own group (its sha), so no merge's run
# is cancelled, running or pending, by the merge after it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26.7"

jobs:
  # Every job is bounded: without `timeout-minutes` a hung job holds one of the
  # org's 20 shared Actions job slots for GitHub's 6-hour default. No path
  # filter: the jobs cannot be separated by area. The Go service embeds the
  # descriptor that `contract drift` regenerates from the TypeScript contracts,
  # and that job's fixtures come from the Go types, so a change on either side
  # is a change to both.
  # The Seldon race (OxyHQ/oxy docs/engineering/build-and-deploy.md, CI on
  # Seldon), opt-in with the repository variable CI_SELDON_RACE=true, on
  # same-repository pull requests only (push runs stay hosted). Unset, every
  # job runs hosted as before and none of these takes a runner. Set, `build,
  # vet, lint, test` and `contract drift` run on the self-hosted seldon-ci pool;
  # a lane still queued 3 minutes after it was created gets its hosted twin
  # (the `-hosted` jobs), the lane that starts first wins and the finish job
  # cancels the other through its job-level concurrency group. A Seldon lane
  # that fails, whatever the reason (the house network drops new connections
  # in bursts), reruns hosted in its `-rescue` job, which fails again on a
  # genuine failure. CI complete takes the raced jobs' verdict from the race.
  race:
    if: ${{ vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-start.yml@main
    permissions:
      actions: read
    with:
      names: |
        build, vet, lint, test
        contract drift

  race-finish:
    needs: race
    # `!cancelled()`: an ancestor skipped on this event must not skip it.
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-finish.yml@main
    permissions:
      actions: read
    with:
      names: |
        build, vet, lint, test
        contract drift

  cloudflare-guardrail:
    name: Cloudflare guardrail tests
    runs-on: ubuntu-latest
    # Measured 5-7 s.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reviewed credential image and migration guards
        run: |
          python3 -B .github/scripts/credential_admin_workflow_test.py
          python3 -B .github/scripts/native_policy_deploy_guard_test.py

      - name: Cloudflare reconcilers fail closed
        run: |
          python3 .github/scripts/cloudflare_rate_limit_test.py
          python3 .github/scripts/cloudflare_dns_test.py

  go:
    name: build, vet, lint, test
    runs-on: &seldon-lane ${{ vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && 'seldon-ci' || 'ubuntu-latest' }}
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-build, vet, lint, test
    permissions: &race-lane-permissions
      contents: read
      actions: read # the Seldon race guard reads this run's jobs
    # Measured 2-3 min with a warm module cache; a cold cache rebuilds the
    # dependency graph twice (with and without -race).
    timeout-minutes: 25
    services: &go-services
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kaana-ci-password
          POSTGRES_DB: kaana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaana_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps: &go-steps
      # A lane that starts after its hosted twin waits here to be cancelled (the Seldon race).
      - &race-guard
        name: Seldon race guard
        if: vars.CI_SELDON_RACE == 'true' && !endsWith(github.job, '-rescue')
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: guard
      - uses: actions/checkout@v4

      # This job is the ONLY writer of the Go module + build cache. setup-go
      # saves once per key and never overwrites, so whichever job saves first
      # owns the key until go.mod/go.sum change. When `contract drift` also
      # cached, it finished first and saved a 13 MB cache holding one small
      # package's build output; this job then restored it on every run and
      # rebuilt the dependency graph (with and without -race) from scratch.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: provision the credential database roles
        env:
          PGPASSWORD: kaana-ci-password
        run: |
          psql --host 127.0.0.1 --username postgres --dbname kaana_test --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE kaana_runtime NOLOGIN;
          CREATE ROLE kaana_migrator NOLOGIN;
          CREATE ROLE kaana_credential_admin NOLOGIN;
          CREATE ROLE kaana_customer_credential_control NOLOGIN;
          CREATE ROLE kaana_platform_credential_control NOLOGIN;
          CREATE ROLE kaana_admission_runtime NOLOGIN;
          CREATE ROLE kaana_admission_admin NOLOGIN;
          SQL

      - name: gofmt
        # `gofmt -l` prints unformatted files and exits 0 either way, so the
        # exit status is not the gate — the output is.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: credential store PostgreSQL integration
        # Every PostgreSQL suite, not a hand-picked few: a suite CI never runs
        # rots silently, as three of them did while only two were selected.
        env:
          KAANA_POSTGRES_TEST_URL: postgres://postgres:kaana-ci-password@127.0.0.1:5432/kaana_test?sslmode=disable
        run: make test-integration

      - name: go test
        # -race because the data plane is concurrent by nature: a stream, a
        # cancellation and an upstream read all touch the same request.
        run: go test -race -count=1 ./...

  # go's hosted twin in the Seldon race: the same name, services and steps.
  go-hosted:
    # The lane's name only while the race is on: unset, this skipped job must not be the newest
    # check run of a name a branch rule may still require (a skip counts as a pass).
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'build, vet, lint, test' || 'build, vet, lint, test (seldon twin, off)' }}
    needs: race
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-build, vet, lint, test
    permissions: *race-lane-permissions
    services: *go-services
    steps: *go-steps

  # go's rescue: reruns it hosted when its Seldon lane failed (the house
  # network drops connections); a genuine failure fails again.
  go-rescue:
    # The lane's name only while the race is on: unset, this skipped job must not be the newest
    # check run of a name a branch rule may still require (a skip counts as a pass).
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'build, vet, lint, test' || 'build, vet, lint, test (seldon rescue, off)' }}
    needs: go
    if: ${{ !cancelled() && needs.go.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: *race-lane-permissions
    services: *go-services
    steps: *go-steps

  contract:
    name: contract drift
    runs-on: *seldon-lane
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-contract drift
    permissions: *race-lane-permissions
    # Measured about 1 min.
    timeout-minutes: 15
    steps: &contract-steps
      - *race-guard
      - uses: actions/checkout@v4

      # No cache here, deliberately: see `build, vet, lint, test`. This job
      # compiles one stdlib-only package, and a save from it would shadow the
      # full build cache.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: install the TypeScript workspace
        run: bun install --frozen-lockfile

      - name: Biome formats and lints the TypeScript workspace
        # The root biome.json includes ONLY packages/** and tools/** (Kaana ADR
        # 0002), so this never reads configs/**, .github/*.json, the descriptor
        # or openapi.json.
        run: bunx biome ci .

      - name: "@kaana.ai/contracts typechecks, passes its suites and builds"
        run: bun run typecheck && bun run test && bun run build
        working-directory: packages/contracts

      - name: "@kaana.ai/sdk typechecks, passes its suites against the fake server and builds"
        # After the contracts build: the SDK imports @kaana.ai/contracts
        # through the workspace, whose entry point is its built dist.
        run: bun run typecheck && bun run test && bun run build
        working-directory: packages/sdk

      - name: the committed descriptor and openapi.json are what the source produces
        # Both derive from the @kaana.ai/contracts workspace source, so the
        # input is the commit: any diff is a contract change nobody re-derived,
        # or a hand edit.
        run: |
          bun run generate
          if ! git diff --exit-code -- ../../internal/contract/descriptor.json ../../packages/contracts/openapi.json; then
            echo "descriptor.json or openapi.json does not match the @kaana.ai/contracts source."
            echo "Run 'bun install --frozen-lockfile && bun run generate' in tools/contract and review the diff."
            exit 1
          fi
        working-directory: tools/contract

      - name: the Go types match the contract
        run: go test -count=1 ./internal/contract/...

      - name: the shapes Kaana produces parse under the contract's Zod schemas
        # Reads the fixtures the step above wrote. It fails on an empty fixture
        # directory and on any rejection control it accepts, so a silent no-op
        # cannot pass as a clean run.
        run: bun run validate
        working-directory: tools/contract

  # contract's hosted twin in the Seldon race: the same name, services and steps.
  contract-hosted:
    # The lane's name only while the race is on: unset, this skipped job must not be the newest
    # check run of a name a branch rule may still require (a skip counts as a pass).
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'contract drift' || 'contract drift (seldon twin, off)' }}
    needs: race
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-contract drift
    permissions: *race-lane-permissions
    steps: *contract-steps

  # contract's rescue: reruns it hosted when its Seldon lane failed (the house
  # network drops connections); a genuine failure fails again.
  contract-rescue:
    # The lane's name only while the race is on: unset, this skipped job must not be the newest
    # check run of a name a branch rule may still require (a skip counts as a pass).
    name: ${{ vars.CI_SELDON_RACE == 'true' && 'contract drift' || 'contract drift (seldon rescue, off)' }}
    needs: contract
    if: ${{ !cancelled() && needs.contract.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: *race-lane-permissions
    steps: *contract-steps

  # The one check this workflow stands for, modelled on OxyHQ/Gemies' and
  # OxyHQ/Bloom's: green only when every job above passed, so a cancelled or
  # skipped job can never read as a pass. A required check by job name cannot
  # follow the Seldon race (a twin and a rescue share their job's name, and a
  # cancelled loser is not a failure); this one can. Nothing here is path
  # filtered, so the only skips it allows are the race's own: the race start,
  # the twins and the rescues skip whenever they are not needed. When the race
  # or a rescue ran, a raced job passes on the race's verdict: each of its
  # names passed in some lane and failed in no hosted lane.
  ci-complete:
    name: CI complete
    if: always()
    # Not race-finish: its reapers run on seldon-ci-light and only follow the
    # cancellation, so needing it would wait on Seldon.
    needs:
      - race
      - cloudflare-guardrail
      - go
      - go-hosted
      - go-rescue
      - contract
      - contract-hosted
      - contract-rescue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the Seldon race verdict reads this run's jobs
    steps:
      # Per job name: passed when one of its lanes succeeded and no hosted lane
      # failed. Whenever the race is on: a rescue can run without the race.
      - name: Seldon race verdict
        id: race
        if: vars.CI_SELDON_RACE == 'true'
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: verdict
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          RACE_VERDICT: ${{ steps.race.outputs.outcome }}
        run: |
          set -euo pipefail
          failures=()
          result() { jq -r --arg job "$1" '.[$job].result // "missing"' <<<"$RESULTS"; }

          # The race's start: skipped when not needed, never failed.
          r="$(result race)"
          case "$r" in
            success | skipped) ;;
            *) failures+=("race did not pass: $r") ;;
          esac

          # A raced family's result, in $family: the verdict when the race
          # raced (and the job was not skipped) or its rescue ran; otherwise
          # the job's own, with its twin and rescue skipped. Not called in a
          # subshell, so its failures reach the list.
          family() {
            local job="$1" own twin rescue raced
            own="$(result "$job")"
            twin="$(result "$job-hosted")"
            rescue="$(result "$job-rescue")"
            raced="$(jq -r '.race.outputs.race // ""' <<<"$RESULTS")"
            if [ "$rescue" != skipped ] || { [ "$raced" = true ] && ! { [ "$own" = skipped ] && [ "$twin" = skipped ]; }; }; then
              family="${RACE_VERDICT:-no verdict}"
              return
            fi
            [ "$twin" = skipped ] || failures+=("$job-hosted ran although the Seldon race did not: $twin")
            family="$own"
          }

          r="$(result cloudflare-guardrail)"
          [ "$r" = success ] || failures+=("cloudflare-guardrail did not pass: $r")
          for job in go contract; do
            family "$job"
            [ "$family" = success ] || failures+=("$job did not pass: $family")
          done

          if [ ${#failures[@]} -gt 0 ]; then
            for failure in "${failures[@]}"; do
              echo "::error::$failure"
            done
            exit 1
          fi
          echo 'Every job passed.'
