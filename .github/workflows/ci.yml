name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes its previous run. A push to `main`
# never does: each `main` commit gets its own group (its sha), so no merge's run
# is cancelled, running or pending, by the merge after it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26.7"

jobs:
  cloudflare-guardrail:
    name: Cloudflare guardrail tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reviewed credential image and migration guards
        run: python3 -B .github/scripts/credential_admin_workflow_test.py

      - name: Cloudflare reconcilers fail closed
        run: |
          python3 .github/scripts/cloudflare_rate_limit_test.py
          python3 .github/scripts/cloudflare_dns_test.py

  go:
    name: build, vet, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kaana-ci-password
          POSTGRES_DB: kaana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaana_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # This job is the ONLY writer of the Go module + build cache. setup-go
      # saves once per key and never overwrites, so whichever job saves first
      # owns the key until go.mod/go.sum change. When `contract drift` also
      # cached, it finished first and saved a 13 MB cache holding one small
      # package's build output; this job then restored it on every run and
      # rebuilt the dependency graph (with and without -race) from scratch.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: provision the credential database roles
        env:
          PGPASSWORD: kaana-ci-password
        run: |
          psql --host 127.0.0.1 --username postgres --dbname kaana_test --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE kaana_runtime NOLOGIN;
          CREATE ROLE kaana_migrator NOLOGIN;
          CREATE ROLE kaana_credential_admin NOLOGIN;
          CREATE ROLE kaana_customer_credential_control NOLOGIN;
          CREATE ROLE kaana_platform_credential_control NOLOGIN;
          SQL

      - name: gofmt
        # `gofmt -l` prints unformatted files and exits 0 either way, so the
        # exit status is not the gate — the output is.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: credential store PostgreSQL integration
        # Every PostgreSQL suite, not a hand-picked few: a suite CI never runs
        # rots silently, as three of them did while only two were selected.
        env:
          KAANA_POSTGRES_TEST_URL: postgres://postgres:kaana-ci-password@127.0.0.1:5432/kaana_test?sslmode=disable
        run: make test-integration

      - name: go test
        # -race because the data plane is concurrent by nature: a stream, a
        # cancellation and an upstream read all touch the same request.
        run: go test -race -count=1 ./...

  contract:
    name: contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No cache here, deliberately: see `build, vet, lint, test`. This job
      # compiles one stdlib-only package, and a save from it would shadow the
      # full build cache.
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: install the pinned contracts package
        run: bun install --frozen-lockfile
        working-directory: tools/contract

      - name: the committed descriptor is what the pinned package produces
        # Catches a hand-edited descriptor and a version bump nobody
        # re-derived. The package version is pinned exactly, so regeneration is
        # deterministic and any diff is a real change.
        run: |
          bun run generate
          if ! git diff --exit-code -- ../../internal/contract/descriptor.json; then
            echo "descriptor.json does not match the pinned @oxy.so/contracts package."
            echo "Run 'bun install --frozen-lockfile && bun run generate' in tools/contract and review the diff."
            exit 1
          fi
        working-directory: tools/contract

      - name: the Go types match the published contract
        run: go test -count=1 ./internal/contract/...

      - name: the shapes Kaana produces parse under the published Zod schemas
        # Reads the fixtures the step above wrote. It fails on an empty fixture
        # directory and on any rejection control it accepts, so a silent no-op
        # cannot pass as a clean run.
        run: bun run validate
        working-directory: tools/contract
